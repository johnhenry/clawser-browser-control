name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Check pod-inject.js is up to date with its source packages
        run: |
          npm run build:pod-inject
          git diff --exit-code pod-inject.js || (
            echo "pod-inject.js is out of date — run 'npm run build:pod-inject' and commit the result." && exit 1
          )

      - name: Validate manifests (Chrome + Firefox)
        run: |
          node -e "
            const m = JSON.parse(require('fs').readFileSync('manifest.json', 'utf8'));
            console.log('Chrome — Name:', m.name, 'Version:', m.version, 'MV:', m.manifest_version);
            if (m.manifest_version !== 3) throw new Error('Expected MV3');
            if (!m.background?.service_worker) throw new Error('Missing service worker');
            console.log('Chrome manifest valid');

            const f = JSON.parse(require('fs').readFileSync('firefox/manifest.json', 'utf8'));
            console.log('Firefox — Name:', f.name, 'Version:', f.version, 'MV:', f.manifest_version);
            if (f.manifest_version !== 3) throw new Error('Expected MV3');
            if (!f.background?.scripts) throw new Error('Missing background scripts');
            if (f.version !== m.version) throw new Error(\`Version mismatch: chrome=\${m.version} firefox=\${f.version}\`);
            console.log('Firefox manifest valid');
          "

      - name: Check required files exist
        run: |
          test -f background.js || (echo "Missing background.js" && exit 1)
          test -f content.js || (echo "Missing content.js" && exit 1)
          test -f pod-inject.js || (echo "Missing pod-inject.js" && exit 1)
          test -f gifenc.js || (echo "Missing gifenc.js" && exit 1)
          test -f offscreen.html || (echo "Missing offscreen.html" && exit 1)
          test -f offscreen.js || (echo "Missing offscreen.js" && exit 1)
          test -f icons/icon-16.png || (echo "Missing icon-16" && exit 1)
          test -f icons/icon-48.png || (echo "Missing icon-48" && exit 1)
          test -f icons/icon-128.png || (echo "Missing icon-128" && exit 1)
          echo "All required files present"

      - name: Build zip (dry run)
        # Same file list as publish.yml's real release zip (scripts/dist-files.txt)
        # so a file present here is guaranteed present in the shipped zip.
        run: |
          mkdir -p dist
          zip -r dist/clawser-browser-control.zip -@ -x "*.DS_Store" < scripts/dist-files.txt
          ls -lh dist/clawser-browser-control.zip

      - name: Build Firefox zip (dry run)
        # Mirrors publish.yml's Firefox zip step so drift is caught on every push.
        run: |
          mkdir -p dist/firefox-stage
          grep -v '^manifest\.json$' scripts/dist-files.txt > /tmp/firefox-dist-files.txt
          cp -r $(cat /tmp/firefox-dist-files.txt) dist/firefox-stage/
          cp firefox/manifest.json dist/firefox-stage/manifest.json
          (cd dist/firefox-stage && zip -r ../clawser-browser-control-firefox.zip . -x "*.DS_Store")
          ls -lh dist/clawser-browser-control-firefox.zip
