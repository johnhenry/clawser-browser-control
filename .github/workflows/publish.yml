name: Publish to Chrome Web Store

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check the tag matches both manifest versions
        # A tag that disagrees with manifest.json would upload a build the store
        # rejects (same version as the live one) or label the GitHub Release wrongly.
        run: |
          tag="${GITHUB_REF_NAME#v}"
          chrome=$(node -p "require('./manifest.json').version")
          firefox=$(node -p "require('./firefox/manifest.json').version")
          echo "tag=$tag chrome=$chrome firefox=$firefox"
          test "$tag" = "$chrome" && test "$tag" = "$firefox"

      - name: Build extension zip
        # File list lives in scripts/dist-files.txt — shared with ci.yml's
        # dry-run zip so the two can't drift apart (a runtime file missing
        # from only this list once shipped a broken release, see #14).
        run: |
          mkdir -p dist
          zip -r dist/clawser-browser-control.zip -@ -x "*.DS_Store" < scripts/dist-files.txt

      - name: Upload to Chrome Web Store
        # v7 uses Chrome Web Store API v2 (Google turns API v1 off on 2026-10-15).
        # The publisher ID is under Publisher > Settings in the Developer Dashboard.
        uses: mnao305/chrome-extension-upload@v7.0.0
        with:
          file-path: dist/clawser-browser-control.zip
          extension-id: dljchbfodafekojicopaboiegophjcbc
          publisher-id: ${{ vars.CWS_PUBLISHER_ID }}
          client-id: ${{ secrets.CWS_CLIENT_ID }}
          client-secret: ${{ secrets.CWS_CLIENT_SECRET }}
          refresh-token: ${{ secrets.CWS_REFRESH_TOKEN }}
          publish: true

      - name: Build the Edge and Firefox zips
        # scripts/package.mjs stages each build from scripts/dist-files.txt with
        # its own manifest at the zip root (Edge ships the Chrome manifest, so
        # its zip differs only in name; Firefox swaps in firefox/manifest.json).
        # Neither store is auto-published from here unless its credentials are
        # configured (see the Edge step below and docs/STORES.md for the AMO step).
        run: node scripts/package.mjs --zip --out dist edge firefox

      - name: Upload to Microsoft Edge Add-ons
        # Skipped until a person creates the Edge listing and sets repository
        # variable EDGE_PRODUCT_ID plus secrets EDGE_CLIENT_ID and EDGE_API_KEY
        # (docs/STORES.md). Uses the Add-ons Publish API v1.1. NOT yet exercised
        # against the live API: the first tagged release after setup is its test.
        if: ${{ vars.EDGE_PRODUCT_ID != '' }}
        env:
          EDGE_PRODUCT_ID: ${{ vars.EDGE_PRODUCT_ID }}
          EDGE_CLIENT_ID: ${{ secrets.EDGE_CLIENT_ID }}
          EDGE_API_KEY: ${{ secrets.EDGE_API_KEY }}
        run: |
          base="https://api.addons.edge.microsoft.com/v1/products/$EDGE_PRODUCT_ID/submissions"
          hdr=(-H "Authorization: ApiKey $EDGE_API_KEY" -H "X-ClientID: $EDGE_CLIENT_ID")
          loc=$(curl -fsS -D - -o /dev/null -X POST "${hdr[@]}" -H "Content-Type: application/zip" \
            --data-binary @dist/clawser-browser-control-edge.zip "$base/draft/package" | tr -d '\r' | awk -F': ' 'tolower($1)=="location"{print $2}')
          test -n "$loc"
          for i in $(seq 1 30); do
            st=$(curl -fsS "${hdr[@]}" "$base/draft/package/operations/$loc" | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).status")
            echo "package status: $st"; [ "$st" = Succeeded ] && break; [ "$st" = Failed ] && exit 1; sleep 10
          done
          test "$st" = Succeeded
          curl -fsS -X POST "${hdr[@]}" -H "Content-Type: application/json" -d '{"notes":"Release ${{ github.ref_name }}"}' "$base"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/clawser-browser-control.zip
            dist/clawser-browser-control-edge.zip
            dist/clawser-browser-control-firefox.zip
          generate_release_notes: true
