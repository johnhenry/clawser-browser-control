name: Publish to Chrome Web Store

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check the tag matches both manifest versions
        # A tag that disagrees with manifest.json would upload a build the store
        # rejects (same version as the live one) or label the GitHub Release wrongly.
        run: |
          tag="${GITHUB_REF_NAME#v}"
          chrome=$(node -p "require('./manifest.json').version")
          firefox=$(node -p "require('./firefox/manifest.json').version")
          echo "tag=$tag chrome=$chrome firefox=$firefox"
          test "$tag" = "$chrome" && test "$tag" = "$firefox"

      - name: Build extension zip
        # File list lives in scripts/dist-files.txt — shared with ci.yml's
        # dry-run zip so the two can't drift apart (a runtime file missing
        # from only this list once shipped a broken release, see #14).
        run: |
          mkdir -p dist
          zip -r dist/clawser-browser-control.zip -@ -x "*.DS_Store" < scripts/dist-files.txt

      - name: Upload to Chrome Web Store
        # v7 uses Chrome Web Store API v2 (Google turns API v1 off on 2026-10-15).
        # The publisher ID is under Publisher > Settings in the Developer Dashboard.
        uses: mnao305/chrome-extension-upload@v7.0.0
        with:
          file-path: dist/clawser-browser-control.zip
          extension-id: dljchbfodafekojicopaboiegophjcbc
          publisher-id: ${{ vars.CWS_PUBLISHER_ID }}
          client-id: ${{ secrets.CWS_CLIENT_ID }}
          client-secret: ${{ secrets.CWS_CLIENT_SECRET }}
          refresh-token: ${{ secrets.CWS_REFRESH_TOKEN }}
          publish: true

      - name: Build Firefox extension zip
        # Same file list as the Chrome zip, but with firefox/manifest.json
        # swapped in at the zip root (extension manifests must be at the
        # archive root). No AMO auto-publish step yet — that needs Mozilla
        # Add-ons API credentials (JWT issuer/secret) this repo doesn't have
        # configured. This just attaches an installable, signed-by-nobody
        # zip to the GitHub Release; manual AMO submission still required
        # until those credentials exist. See #14 item 4.
        run: |
          mkdir -p dist/firefox-stage
          grep -v '^manifest\.json$' scripts/dist-files.txt > /tmp/firefox-dist-files.txt
          cp -r $(cat /tmp/firefox-dist-files.txt) dist/firefox-stage/
          cp firefox/manifest.json dist/firefox-stage/manifest.json
          (cd dist/firefox-stage && zip -r ../clawser-browser-control-firefox.zip . -x "*.DS_Store")

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/clawser-browser-control.zip
            dist/clawser-browser-control-firefox.zip
          generate_release_notes: true
